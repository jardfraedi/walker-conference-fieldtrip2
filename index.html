<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Field Trip Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
html, body, #map {
    height: 100%;
    margin: 0;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([64.8, -14.5], 8);

L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

fetch('data/askewetal-geology.geojson')
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {

        style: function(feature) {

            return {
                color: '#222222',
                weight: 1,
                fillColor: '#ff8800',
                fillOpacity: 0.5
            };
        },

        onEachFeature: function(feature, layer) {

            layer.bindPopup(
				'<h3>' + feature.properties.name_unit + '</h3>' +
				'<p><b>Rock type:</b> ' + feature.properties.rock_type_unit + '</p>' +
				'<p><b>Age:</b> ' + feature.properties.geological_age + '</p>'
			);

        }

    }).addTo(map);

});

fetch('data/stops.geojson')
  .then(response => response.json())
  .then(data => {

const stops = L.geoJSON(data, {

  pointToLayer: function(feature, latlng) {
    return L.circleMarker(latlng, {
      radius: 6,
      fillColor: "#d73027",
      color: "#000",
      weight: 1,
      opacity: 1,
      fillOpacity: 0.9
    });
  },

  onEachFeature: function(feature, layer) {

    let p = feature.properties;

    layer.bindTooltip(
      p.locality_name,
      {
        permanent: true,
        direction: 'right',
        offset: [10, 0]
      }
    );

    layer.bindPopup(
      '<h3>' + p.locality_name + '</h3>' +
      '<p>' + p.summary + '</p>'
    );
  }

}).addTo(map);

map.fitBounds(stops.getBounds());

let userMarker;

map.locate({
  watch: true,
  enableHighAccuracy: true
});

map.on('locationfound', function(e) {

  if (userMarker) {
    map.removeLayer(userMarker);
  }

  userMarker = L.circleMarker(e.latlng, {
    radius: 8,
    fillColor: '#0078ff',
    color: '#ffffff',
    weight: 2,
    fillOpacity: 1
  }).addTo(map);

});
});
</script>

</body>
</html>
